[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vetal-pr"
version = "0.1.0"
description = "🌳 Vetal — a ghost that won't let you push until you explain your own diff"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Rajanikant", email = "rajanikantsinghnitr@gmail.com"}
]
keywords = ["git", "code-review", "ollama", "gemma", "pre-push-hook", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Version Control :: Git",
]

[project.scripts]
vetal = "vetal.cli:main"

[project.urls]
Homepage = "https://github.com/rajanikant04/ghostWire"
Repository = "https://github.com/rajanikant04/ghostWire"

[tool.setuptools.packages.find]
include = ["vetal*"]
